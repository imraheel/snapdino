<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#000000" />
	<meta name="description" content="SnapDino - Image crop, resize and enhance made easy">
	<meta name="author" content="Raheel Khan - https://github.com/imraheel">
	<meta name="keyword" content="snapdino,snap,image,crop,resize,,enhance">
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/app-icon/icon-512.png" />
	<!--
		manifest.json provides metadata used when your web app is installed on a
		user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
	-->
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
	<!-- <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';"> -->
	<!--
		Notice the use of %PUBLIC_URL% in the tags above.
		It will be replaced with the URL of the `public` folder during the build.
		Only files inside the `public` folder can be referenced from the HTML.

		Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
		work correctly both with client-side routing and a non-root public URL.
		Learn how to configure a non-root public URL by running `npm run build`.
	-->
	<title>SnapDino</title>

	<style>
		*,
		*::before,
		*::after {
			padding: 0;
			margin: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
				"Droid Sans", "Helvetica Neue", sans-serif;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			background: #252931;
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			color: #fff;
			height: 100vh;
		}

		h2 {
			margin-bottom: 15px;
		}

		img {
			width: auto;
			height: 60px;
		}
	</style>
</head>
<body>
	<img src="./app-icon/icon-1024.png" alt="SnapDino Logo" >
	<h2>SnapDino</h2>
	<p>Version: <span id="version"></span></p>

	<script>
		const container = document.getElementById('version')
		container.innerHTML = window.location.search.split('=')[1]
	</script>
</body>
</html>
